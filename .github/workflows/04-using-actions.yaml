name: 04 - Us Actions

on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'
            - name: Install Dependencoes
              run: npm ci
              working-directory: 04-using-actions/react-app
