name: 13 - Using Caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                description: Whether to execute cache setup
                type: boolean
                default: true
            node-version:
                description: Node Version
                type: choice
                options:
                    - 18.x
                    - 20.x
                    - 24.x
                default: 20.x

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 04-using-actions/react-app
        steps:
            # 1. Checkout the code
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{inputs.node-version}}
            # 2. Install dependencies
            - name: Install Dependencies
              run: npm ci
              # 3. Linting, formatting, unit test and building
            - name: Testing
              run: npm run test
            - name: Building
              run: npm run build
              # 4. Deploy to a nonprod environment
            - name: Deploy to non prod
              run: echo "Deploying to nonprod"
